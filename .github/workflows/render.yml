name: Vyrenderovat vizualy

on:
  push:
    paths:
      - 'prispevky/**'
      - 'sablona/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dekodovat logo
        run: |
          base64 -d sablona/logo.b64 > sablona/logo.webp
          file sablona/logo.webp

      - name: Stahnout fonty
        run: |
          mkdir -p sablona/fonty
          curl -fsSL -o 'sablona/fonty/Urbanist[wght].ttf' \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/urbanist/Urbanist%5Bwght%5D.ttf'
          curl -fsSL -o 'sablona/fonty/Inter[opsz,wght].ttf' \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf'
          ls -la sablona/fonty

      - name: Nainstalovat prohlizec
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Vyrenderovat vizualy
        run: node sablona/render.mjs

      - name: Commitnout vysledek
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/
          if git diff --staged --quiet; then
            echo 'Zadna zmena v obrazcich, neni co commitnout.'
          else
            git commit -m 'Vyrenderovane vizualy [skip ci]'
            git push
          fi
